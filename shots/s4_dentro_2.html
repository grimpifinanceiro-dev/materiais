<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../lib/common.css"><script src="../node_modules/gsap/dist/gsap.min.js"></script>
<style>
.card{display:flex;align-items:center;gap:36px;padding:34px 48px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;width:1200px;box-sizing:border-box;margin:14px 0;position:relative;overflow:hidden;text-align:left}
.fmt-v .card{width:920px;padding:34px 40px;gap:28px}
.idx{font-family:'Michroma';font-size:26px;color:var(--cyan);flex:none;letter-spacing:.06em}
.glint{position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(31,182,222,.18),transparent);transform:translateX(-120%);pointer-events:none}
.bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--cyan);transform-origin:0 50%;transform:scaleX(0)}
.item{font-size:56px}
.fmt-v .item{font-size:50px}
.card{width:1360px}
.fmt-v .card{width:920px}
</style></head><body><div id="stage">
<div id="content">
  <div class="card"><span class="idx">01</span><div class="line item">Formação em BPO Financeiro</div><i class="glint"></i><i class="bar"></i></div>
  <div class="card"><span class="idx">02</span><div class="line item">Formação em Inteligência Artificial</div><i class="glint"></i><i class="bar"></i></div>
  <div class="card"><span class="idx">03</span><div class="line item">Comunidade e troca de experiências</div><i class="glint"></i><i class="bar"></i></div>
</div></div><script src="../lib/stage.js"></script><script>
CDF.build(({tl,f,words,exit,push,dur})=>{
  push('#content',1,1.025,0,dur-14);
  const cards=[...document.querySelectorAll('.card')];
  cards.forEach((c,i)=>{
    const at=66*i;
    tl.fromTo(c,{opacity:0,y:60},{opacity:1,y:0,duration:f(26),ease:'expo.out'},f(at));
    tl.fromTo(c,{borderColor:'#262B30'},{borderColor:'rgba(31,182,222,.55)',duration:f(14),ease:'power2.inOut'},f(at+4));
    tl.fromTo(c.querySelector('.idx'),{opacity:0,x:-20},{opacity:1,x:0,duration:f(20),ease:'expo.out'},f(at+2));
    words(c.querySelector('.line'),at+6);
    tl.to(c.querySelector('.bar'),{scaleX:1,duration:f(40),ease:'power3.out'},f(at+10));
    if(i>0) tl.to(cards[i-1],{borderColor:'#262B30',duration:f(14),ease:'power2.inOut'},f(at+4));
  });
  cards.forEach((c,i)=>tl.fromTo(c.querySelector('.glint'),{xPercent:-120},{xPercent:260,duration:f(36),ease:'power2.inOut'},f(190+30*i)));
  exit(cards,dur-14,{y:-30});
});
</script></body></html>
